      - "Record the generated application identifier and administrator verification evidence."
    recovery_condition: "A tested public Arcubase app-create capability is added to a future Kit contract, or an authorized administrator completes the manual route."
    verification_condition: "The application exists in the intended Team with the approved owner and isolation boundary, and its identifier is recorded without credentials."
  - operation_id: "arcubase-table.create"
    description: "Create Arcubase tables and fields from the approved schema."
    executor: "admin-manual"
    support: "manual-required"
    risk_level: "critical"
    manual_artifacts:
      - "arcubase/schema.yaml"
      - "arcubase/access-matrix.md"
      - "acceptance/test-cases.yaml"
    manual_instructions:
      - "Validate field types, constraints, links, states, derived-field ownership, and migration impact."
      - "Have an authorized Arcubase administrator create the tables and apply hard permissions."
      - "Record table and field identifiers, then run the documented permission and schema checks."
    recovery_condition: "A tested public Arcubase table-create capability is added to a future Kit contract, or an authorized administrator completes the manual route."
    verification_condition: "All approved tables, fields, links, constraints, and hard permissions exist and pass authorized and unauthorized acceptance checks."
