manual_required:
  - operation_id: "skill-set.create"
    description: "Create a Team skill set manually. octopus-cli 0.1.2 exposes configure skill set add and advertises body options, but execution-layer probes show body/query options are dropped for this path."
    executor: "admin-manual"
    support: "manual-required"
    risk_level: "high"
    manual_artifacts:
      - "skills/<skill-slug>/"
    manual_instructions:
      - "Have an authorized administrator create the approved Skill set through the platform interface."
      - "Bind uploaded ordinary Skills manually when the platform requires returned Skill identifiers."
      - "Record the returned Skill-set identifier, Skill binding identifiers, and verification evidence without credentials."
    recovery_condition: "A future tested octopus-cli contract proves configure skill set add forwards body options correctly, or an authorized administrator completes the manual route."
    verification_condition: "The Skill set metadata and Skill bindings match the approved assembly plan and are recorded in assembly evidence."
  - operation_id: "skill-package.upload"
