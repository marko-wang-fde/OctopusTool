context_probe:
  operation_id: "auth.whoami"
  description: "Read the current authenticated CLI Profile and Team context."
  executor: "octopus-cli"
  operation_kind: "read"
  command_path:
    - "auth"
    - "whoami"
  positional_args: []
  options:
    profile: "--profile"
    output: "--json"
  option_shape:
    profile:
      arity: "value"
      required: false
      allowed_forms:
        - "separate"
    output:
      arity: "boolean"
      required: true
      allowed_forms:
        - "standalone"
  output_contract:
    format: "json"
    profile_path:
      - "profile"
    team_path:
      - "team"
      - "id"
  explicit_context_argv: null
supported:
  - operation_id: "skill.upload"
    description: "Upload one ordinary Team Skill markdown document from an API-native JSON payload."
    executor: "octopus-cli"
    support: "supported"
    command_path:
      - "configure"
      - "skill"
      - "upload"
      - "add"
    positional_args: []
    options:
      payload: "--body-file"
      output: "--json"
    option_shape:
      payload:
        arity: "value"
        required: true
        allowed_forms:
          - "separate"
      output:
        arity: "boolean"
        required: true
        allowed_forms:
          - "standalone"
    output_contract:
      format: "json"
      bindings:
        skill_id:
          paths:
            - ["data", "skill", "id"]
            - ["skill", "id"]
    manual_fallback:
      executor: "admin-manual"
      manual_artifacts:
        - "skills/<skill-slug>/SKILL.md"
      manual_instructions:
        - "Have an authorized administrator upload the approved ordinary Team Skill markdown through the platform interface."
        - "Record the returned Skill identifier and content digest without credentials."
      recovery_condition: "The tested CLI command is restored, or an authorized administrator completes and verifies this same operation manually."
      verification_condition: "The uploaded Team Skill content matches the approved Skill markdown and the returned Skill identifier is recorded in assembly evidence."
    payload_schema_uri: "schemas/payloads/skill-upload.schema.json"
    risk_level: "high"
    contract_version: "1.0.0"
    cli_evidence_rule: "Require API-native JSON payload contract, command presence in --help-json, matching leaf --help, body-forwarding dryrun evidence, and returned skill.id binding evidence."
    execution_policy: "live-assembly"
  - operation_id: "skill.enable-assembly"
    description: "Enable a previously uploaded Team Skill as an assemblable Skill and return its public Skillset binding."
    executor: "octopus-cli"
    support: "supported"
    command_path:
      - "configure"
      - "skill"
      - "enable-assembly"
      - "add"
    positional_args:
      - "<id>"
    options:
      output: "--json"
    option_shape:
      output:
        arity: "boolean"
        required: true
        allowed_forms:
          - "standalone"
    output_contract:
      format: "json"
      skill_id_paths:
        - ["data", "skillId"]
        - ["skillId"]
      skillset_id_paths:
        - ["data", "skillsetId"]
        - ["skillsetId"]
      bindings:
        skill_id:
          paths:
            - ["data", "skillId"]
            - ["skillId"]
        skillset_id:
          paths:
            - ["data", "skillsetId"]
            - ["skillsetId"]
    manual_fallback:
      executor: "admin-manual"
      manual_artifacts:
        - "skills/<skill-slug>/SKILL.md"
      manual_instructions:
        - "Have an authorized administrator enable the uploaded Team Skill for assembly."
        - "Record the returned assemblable Skill identifier and Skillset identifier without credentials."
      recovery_condition: "The tested CLI command is restored, or an authorized administrator completes and verifies this same operation manually."
      verification_condition: "The uploaded Skill is visible as an assemblable Team Skill and its Skillset identifier is recorded in assembly evidence."
    payload_schema_uri: null
    risk_level: "high"
    contract_version: "1.0.0"
    cli_evidence_rule: "Require a real uploaded skill.id as positional argument, command presence in --help-json, matching leaf --help, and returned skillsetId binding evidence."
    execution_policy: "live-assembly"
