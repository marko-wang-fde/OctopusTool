      - "Record the returned Skill identifier and package digest in the assembly evidence."
    recovery_condition: "A tested public ordinary-Skill upload capability is added to a future Kit contract, or an authorized administrator completes the manual route."
    verification_condition: "The platform displays the uploaded package version and digest, and the identifier resolves from the approved Team without enabling production use."
  - operation_id: "arcubase-app.create"
    description: "Create a dedicated Arcubase application."
