schema_version: 1
cases:
  - id: acceptance.complete_registration
    title: 完整登记
    category: normal
    preconditions:
      - Current Speaker 是 user.fixture.sales.zhang_nan（销售张楠）。
      - Fixture 时钟是 2026-07-24T01:00:00Z。
    steps:
      - 销售张楠输入：登记苏州星禾包装有限公司，王芳，13900000002，希望了解经销商线索管理，来源展会
      - 销售张楠输入：确认登记
    expected_results:
      - 首次固定输出：待确认：公司=苏州星禾包装有限公司，联系人=王芳，联系方式=13900000002，需求=希望了解经销商线索管理，来源=展会。回复“确认登记”或“取消”。
      - 确认后固定输出：登记成功，记录ID=rec.fixture.sz-xinghe-001。
      - scenario.lead_collection 与 skill.collect_sales_leads 返回上述固定输出。
      - 恰好创建一行，九字段值为 company_name=苏州星禾包装有限公司、contact_name=王芳、contact_method=13900000002、requirement_summary=希望了解经销商线索管理、source=3、submitter_arcubase_user_id=user.fixture.sales.zhang_nan、submitter_name=销售张楠、status=1、created_at=1784854800。
      - team-private-digiworker.create 自动装配设计与 skill-set.create 人工步骤一致。
  - id: acceptance.missing_contact
    title: 缺少联系方式
    category: exception
    preconditions: [Current Speaker 是 user.fixture.sales.zhang_nan（销售张楠）。]
    steps:
      - 销售张楠输入：登记苏州启明包装，联系人赵蕾，需要报价，来源转介绍
    expected_results:
      - 固定输出：请补充赵蕾的联系方式（手机号或邮箱）。
      - Arcubase 创建调用次数为 0。
  - id: acceptance.duplicate_cancel
    title: 疑似重复
    category: human-gate
    preconditions:
      - 预置杭州清禾食品有限公司、李明、138 0000 0001、status=1 的记录。
    steps:
      - 销售张楠输入：登记 杭州清禾食品有限公司，李明，138-0000-0001，需要样品，展会
      - 销售张楠输入：取消
    expected_results:
      - 首次固定输出：发现疑似重复线索：杭州清禾食品有限公司，李明，138 0000 0001。回复“仍要新增”或“取消”。
      - 取消后固定输出：已取消，本次未登记线索。
      - scenario.lead_collection 与 skill.collect_sales_leads 返回上述固定输出。
      - Arcubase 创建调用次数为 0。
      - team-private-digiworker.create 只在明确人工门后装配，skill-set.create 保持人工证据步骤。
  - id: acceptance.summary_cancel
    title: 摘要取消
    category: refusal
    preconditions: [线索完整且不重复]
    steps:
      - 销售张楠输入：登记苏州星禾包装有限公司，王芳，13900000002，希望了解经销商线索管理，来源展会
      - 销售张楠输入：取消
    expected_results:
      - 首次固定输出：待确认：公司=苏州星禾包装有限公司，联系人=王芳，联系方式=13900000002，需求=希望了解经销商线索管理，来源=展会。回复“确认登记”或“取消”。
      - 取消后固定输出：已取消，本次未登记线索。
      - scenario.lead_collection 与 skill.collect_sales_leads 返回上述固定输出。
      - Arcubase 创建调用次数为 0。
      - team-private-digiworker.create 不得在取消后执行，skill-set.create 不得自动执行。
  - id: acceptance.unauthorized_all
    title: 未授权全量查询
    category: permission
    preconditions: [Current Speaker 是 user.fixture.intern 且仅有 role.intern。]
    steps:
      - 实习生输入：列出所有销售线索
    expected_results:
      - 固定输出：权限不足：你无权查看全部销售线索。
      - scenario.lead_collection 与 skill.collect_sales_leads 返回上述固定输出。
      - Arcubase 业务表查询调用次数为 0。
      - team-private-digiworker.create 不授予未授权身份，skill-set.create 由管理员人工记录证据。
  - id: acceptance.sales_own
    title: 销售本人查询
    category: permission
    preconditions: [Current Speaker 是 user.fixture.sales.zhang_nan]
    steps:
      - 销售张楠输入：查看我提交的线索
    expected_results:
      - 固定输出：已按提交人“销售张楠”筛选，仅返回你提交的线索。
      - 查询条件固定为 field.submitter_arcubase_user_id = user.fixture.sales.zhang_nan，不返回他人记录。
  - id: acceptance.manager_all
    title: 经理查询
    category: normal
    preconditions: [Current Speaker 是 user.fixture.manager.chen_chen]
    steps:
      - 销售经理陈晨输入：查看全部线索
    expected_results:
      - 固定输出：已返回全部销售线索（只读）。
      - role.sales_manager 校验通过，Arcubase 写调用次数为 0。
  - id: acceptance.static_consistency
    title: 静态一致性
    category: normal
    preconditions: [项目文件完整]
    steps:
      - 运行 validate-project 静态校验
    expected_results:
      - 固定命令结果：exitCode=0，status=ok，BLOCKER=0。
      - skill.collect_sales_leads 字段、员工 Skill、toolkitKeys、权限和状态值全部匹配。
  - id: acceptance.assembly_live
    title: 直接装配
    category: human-gate
    preconditions: [Profile 和 Team 明确]
    steps:
      - 用户确认 Profile、Team 和交付包 hash
      - 运行 assembly/octopus-cli-assemble.sh 直接装配
    expected_results:
      - 固定命令结果：exitCode=0，team-private-digiworker.create 返回平台对象标识。
      - 唯一自动调用不包含 --dryrun，Skill 上传、技能集创建和绑定、Arcubase 建表保持 manual-required。
